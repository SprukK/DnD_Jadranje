<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>☠ Gilded Kraken — GM v4</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b2a;--navy-mid:#1a2e45;--navy-light:#243b55;--navy-dark:#080f18;
  --parchment:#f4e9d0;--parchment-dark:#e8d5a3;
  --gold:#c9922a;--gold-light:#e8b84b;--gold-bright:#ffd76a;--amber:#d4822a;--rust:#8b3a1e;
  --sea:#2a6b5e;--sea-light:#3d9a89;--sea-dark:#1d4f47;
  --text-dark:#1a1208;--white:#fdf8ef;--red:#c0392b;--teal:#0891b2;
  --spell:#8b5cf6;--warlock:#ec4899;--ki:#a78bfa;
  --common:#9ca3af;--uncommon:#4ade80;--rare:#93c5fd;--very-rare:#c4b5fd;--legendary:#ffd76a;
  --font-d:'Cinzel','Palatino Linotype',Georgia,serif;
  --font-b:'Crimson Text',Georgia,'Times New Roman',serif;
  --tab-h:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* ===== ANIMATION TOKENS ===== */
:root{
  --ease-out-quart:cubic-bezier(0.165,0.84,0.44,1);
  --ease-out-cubic:cubic-bezier(0.215,0.61,0.355,1);
  --ease-in-out-cubic:cubic-bezier(0.645,0.045,0.355,1);
  --dur-micro:120ms;
  --dur-ui:200ms;
  --dur-modal:250ms;
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--navy-dark);color:var(--parchment);font-family:var(--font-b);min-height:100vh;overflow:hidden}
.gm-header{background:linear-gradient(90deg,var(--navy-dark),var(--navy-mid));border-bottom:2px solid rgba(201,146,42,.3);padding:.55rem .8rem;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:200;height:48px}
.gm-title{font-family:var(--font-d);font-size:.78rem;font-weight:900;color:var(--gold-light);letter-spacing:.08em}
.gm-badge{font-family:var(--font-d);font-size:.52rem;font-weight:700;background:rgba(192,57,43,.25);border:1px solid rgba(192,57,43,.5);border-radius:4px;padding:.1rem .4rem;color:#ff8a80;letter-spacing:.05em}
.tab-content{display:none;position:fixed;top:48px;left:0;right:0;bottom:var(--tab-h);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.7rem .7rem calc(env(safe-area-inset-bottom) + .5rem)}
.tab-content.active{display:block;animation:tab-enter var(--dur-ui) var(--ease-out-quart)}
@keyframes tab-enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
body::after{content:'';position:fixed;top:48px;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);z-index:150;pointer-events:none}
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom));background:var(--navy-dark);border-top:1px solid rgba(201,146,42,.22);display:grid;grid-template-columns:repeat(5,1fr);z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color:var(--parchment-dark);opacity:.4;transition:opacity var(--dur-ui) ease,color var(--dur-ui) ease;padding:.3rem 0}
.tab-btn .ti{font-size:1.25rem;line-height:1;transition:transform var(--dur-micro) ease}
.tab-btn:active .ti{transform:scale(0.88)}
.tab-btn .tl{font-family:var(--font-d);font-size:.44rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tab-btn.active{opacity:1;color:var(--gold-light)}
.card{background:var(--navy-mid);border:1px solid rgba(201,146,42,.18);border-radius:10px;overflow:hidden;margin-bottom:.6rem}
.card-head{background:linear-gradient(90deg,var(--navy-dark),var(--navy));color:var(--gold-light);font-family:var(--font-d);font-size:.67rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.42rem .7rem;display:flex;align-items:center;gap:.35rem;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.card-head .chv{margin-left:auto;transition:transform var(--dur-ui) var(--ease-in-out-cubic);font-style:normal;font-size:.7rem}
.card-head.collapsed .chv{transform:rotate(-90deg)}
.card-body{padding:.6rem .7rem}
.card-body.hidden{display:none}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(201,146,42,.2),transparent);margin:.45rem 0}

/* NOTES / SCENE ROWS */
.scene-list{display:flex;flex-direction:column;gap:.3rem}
.scene-row{display:flex;align-items:flex-start;gap:.5rem;padding:.4rem .55rem;background:var(--navy);border-radius:8px;border:1px solid rgba(201,146,42,.12);transition:border-color var(--dur-ui) ease,opacity var(--dur-ui) ease}
.scene-row.done{opacity:.45}
.scene-row.done .scene-label{text-decoration:line-through}
.scene-check{width:22px;height:22px;border-radius:50%;border:2px solid rgba(201,146,42,.4);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:.65rem;transition:background var(--dur-ui) var(--ease-out-cubic),border-color var(--dur-ui) var(--ease-out-cubic),transform var(--dur-micro) ease;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;will-change:transform}
.scene-check:active{transform:scale(0.85)}
.scene-row.done .scene-check{background:var(--sea);border-color:var(--sea-light);color:var(--white)}
.scene-info{flex:1;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.scene-label{font-family:var(--font-d);font-size:.68rem;font-weight:700;color:var(--gold-light)}
.scene-desc{font-family:var(--font-b);font-size:.7rem;color:var(--parchment-dark);opacity:.6;margin-top:.08rem;line-height:1.3}
.scene-open-hint{font-family:var(--font-d);font-size:.48rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(201,146,42,.4);margin-top:.18rem}
.act-label{font-family:var(--font-d);font-size:.55rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--parchment-dark);opacity:.4;margin:.5rem 0 .25rem .1rem}
.notes-textarea{width:100%;min-height:120px;background:rgba(255,255,255,.05);border:1px solid rgba(201,146,42,.2);border-radius:8px;padding:.55rem;font-family:var(--font-b);font-size:.9rem;color:var(--parchment);line-height:1.5;resize:vertical}
.notes-textarea:focus{outline:none;border-color:var(--gold)}
.quick-ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
.qr-box{background:var(--navy);border:1px solid rgba(201,146,42,.15);border-radius:7px;padding:.4rem .5rem;text-align:center}
.qr-diff{font-family:var(--font-d);font-size:.58rem;font-weight:700;color:var(--parchment-dark);opacity:.6;text-transform:uppercase;letter-spacing:.06em}
.qr-dc{font-family:var(--font-d);font-size:1.3rem;font-weight:900;color:var(--gold-bright);line-height:1}
.sea-event-btn{width:100%;padding:.55rem;background:linear-gradient(135deg,var(--sea-dark),var(--sea));border:none;border-radius:8px;font-family:var(--font-d);font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--white);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sea-event-result{margin-top:.45rem;background:var(--navy);border:1px solid rgba(61,154,137,.3);border-radius:8px;padding:.45rem .6rem;font-family:var(--font-b);font-style:italic;font-size:.82rem;color:#7dd8cc;line-height:1.4;display:none}
.sea-event-result.visible{display:block;animation:sea-in var(--dur-ui) var(--ease-out-quart)}
@keyframes sea-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.scene-note-entry{margin-bottom:.4rem;padding:.35rem .5rem;background:rgba(0,0,0,.2);border-radius:7px;border-left:2px solid rgba(201,146,42,.3)}
.sne-label{font-family:var(--font-d);font-size:.55rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gold-light);opacity:.7;margin-bottom:.15rem}
.sne-text{font-family:var(--font-b);font-size:.78rem;color:var(--parchment-dark);line-height:1.4}

/* SCENE DETAIL PANEL */
.scene-panel{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;background:var(--navy-dark);transform:translateY(100%);transition:transform var(--dur-modal) var(--ease-out-quart);will-change:transform}
.scene-panel.open{transform:translateY(0)}
.sp-header{background:linear-gradient(135deg,var(--navy-dark),var(--navy-mid));border-bottom:1px solid rgba(201,146,42,.25);padding:.6rem .8rem;display:flex;align-items:center;gap:.5rem;flex-shrink:0;min-height:52px}
.sp-close{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--parchment-dark);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sp-title-block{flex:1}
.sp-act{font-family:var(--font-d);font-size:.52rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--parchment-dark);opacity:.5}
.sp-title{font-family:var(--font-d);font-size:.82rem;font-weight:700;color:var(--gold-light);line-height:1.2}
.sl-toggle-btn{padding:.28rem .5rem;border-radius:6px;background:rgba(8,145,178,.15);border:1px solid rgba(8,145,178,.35);font-family:var(--font-d);font-size:.58rem;font-weight:700;letter-spacing:.05em;color:#67e8f9;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap}
.sl-toggle-btn.active{background:rgba(8,145,178,.35);border-color:#0891b2}
.sp-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.75rem}
.sp-footer{background:var(--navy-dark);border-top:1px solid rgba(201,146,42,.2);padding:.5rem .8rem calc(env(safe-area-inset-bottom) + .4rem);display:grid;grid-template-columns:1fr auto 1fr;gap:.4rem;align-items:center;flex-shrink:0}
.sp-nav-btn{padding:.42rem .6rem;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-family:var(--font-d);font-size:.62rem;font-weight:700;letter-spacing:.04em;color:var(--parchment-dark);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:center}
.sp-nav-btn:active{background:rgba(255,255,255,.15)}
.sp-nav-btn.disabled{opacity:.25;pointer-events:none}
.sp-done-btn{padding:.45rem .7rem;border:none;border-radius:8px;font-family:var(--font-d);font-size:.68rem;font-weight:700;letter-spacing:.05em;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:rgba(42,107,94,.35);border:1px solid rgba(61,154,137,.5);color:#7dd8cc;text-align:center}
.sp-done-btn.done{background:rgba(42,107,94,.6);border-color:var(--sea-light);color:var(--white)}

/* SCENE DETAIL CONTENT */
.sp-section{margin-bottom:.9rem}
.sp-section-label{font-family:var(--font-d);font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--parchment-dark);opacity:.4;margin-bottom:.38rem}
.steps-list{display:flex;flex-direction:column;gap:.32rem}
.step-row{display:flex;gap:.5rem;align-items:flex-start}
.step-num{font-family:var(--font-d);font-size:.7rem;font-weight:900;color:var(--gold-bright);min-width:18px;flex-shrink:0;line-height:1.5}
.step-text{font-family:var(--font-b);font-size:.82rem;color:var(--parchment);line-height:1.5}
.step-text strong{color:var(--gold-light);font-weight:600}

/* READ ALOUD BOX */
.read-aloud-box{background:linear-gradient(135deg,rgba(13,27,42,.9),rgba(26,46,69,.9));border:1px solid rgba(201,146,42,.3);border-left:3px solid var(--gold);border-radius:8px;padding:.65rem .75rem;position:relative}
.ra-label{font-family:var(--font-d);font-size:.5rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-light);opacity:.6;margin-bottom:.3rem}
.ra-text{font-family:var(--font-b);font-style:italic;font-size:.88rem;color:var(--parchment);line-height:1.6}
.ra-text-sl{display:none}
.scene-panel.sl-on .ra-text{display:none}
.scene-panel.sl-on .ra-text-sl{display:block}
.ra-box2{margin-top:.45rem}

/* SKILL CHECK CALLOUTS */
.check-list{display:flex;flex-direction:column;gap:.32rem}
.check-box{display:flex;gap:.45rem;padding:.38rem .5rem;background:rgba(8,145,178,.1);border:1px solid rgba(8,145,178,.25);border-radius:7px;align-items:flex-start}
.check-dc{font-family:var(--font-d);font-size:.65rem;font-weight:900;color:#67e8f9;white-space:nowrap;flex-shrink:0;padding-top:.05rem}
.check-body{}
.check-skill{font-family:var(--font-d);font-size:.6rem;font-weight:700;color:#7dd8cc;margin-bottom:.07rem}
.check-result{font-family:var(--font-b);font-size:.77rem;color:var(--parchment-dark);line-height:1.35}
.check-who{font-size:.58rem;font-style:italic;opacity:.65}

/* NPC CHIPS */
.npc-chips{display:flex;flex-wrap:wrap;gap:.32rem}
.npc-chip{display:flex;align-items:center;gap:.28rem;padding:.28rem .5rem;background:rgba(201,146,42,.12);border:1px solid rgba(201,146,42,.3);border-radius:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background var(--dur-micro) ease,border-color var(--dur-micro) ease,transform var(--dur-micro) ease}
.npc-chip:active{background:rgba(201,146,42,.28);transform:scale(0.96)}
.npc-chip-emoji{font-size:.9rem}
.npc-chip-name{font-family:var(--font-d);font-size:.6rem;font-weight:700;color:var(--gold-light)}

/* DIALOGUE */
.dialogue-list{display:flex;flex-direction:column;gap:.45rem}
.dialogue-entry{padding:.45rem .55rem;background:rgba(0,0,0,.25);border-radius:8px;border-left:2px solid rgba(201,146,42,.4)}
.dlg-speaker{font-family:var(--font-d);font-size:.58rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-light);margin-bottom:.22rem}
.dlg-context{font-family:var(--font-b);font-size:.68rem;color:var(--parchment-dark);opacity:.55;font-style:italic;margin-bottom:.15rem}
.dlg-en{font-family:var(--font-b);font-style:italic;font-size:.84rem;color:var(--parchment);line-height:1.5}
.dlg-sl{display:none;font-family:var(--font-b);font-style:italic;font-size:.82rem;color:#7dd8cc;line-height:1.5;margin-top:.18rem;border-top:1px solid rgba(8,145,178,.2);padding-top:.18rem}
.scene-panel.sl-on .dlg-sl{display:block}

/* BRANCHING */
.branch-list{display:flex;flex-direction:column;gap:.35rem}
.branch-row{padding:.38rem .5rem;background:rgba(61,154,137,.08);border:1px solid rgba(61,154,137,.22);border-radius:7px}
.branch-label{font-family:var(--font-d);font-size:.6rem;font-weight:700;color:#7dd8cc;margin-bottom:.12rem}
.branch-text{font-family:var(--font-b);font-size:.77rem;color:var(--parchment-dark);line-height:1.4}

/* HOMEBREW REMINDER */
.hb-box{background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.25);border-radius:8px;padding:.45rem .6rem}
.hb-label{font-family:var(--font-d);font-size:.55rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a78bfa;margin-bottom:.18rem}
.hb-text{font-family:var(--font-b);font-size:.78rem;color:var(--parchment-dark);line-height:1.45}
.hb-text strong{color:#c4b5fd;font-weight:600}

/* START COMBAT BUTTON */
.start-combat-btn{width:100%;padding:.6rem;background:linear-gradient(135deg,rgba(192,57,43,.35),rgba(139,58,30,.35));border:1px solid rgba(192,57,43,.5);border-radius:9px;font-family:var(--font-d);font-size:.72rem;font-weight:700;letter-spacing:.06em;color:#ff8a80;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:center}
.start-combat-btn:active{background:rgba(192,57,43,.55)}

/* GM NOTES IN PANEL */
.sp-notes-input{width:100%;min-height:80px;background:rgba(255,255,255,.04);border:1px solid rgba(201,146,42,.18);border-radius:7px;padding:.45rem;font-family:var(--font-b);font-size:.82rem;color:var(--parchment);line-height:1.5;resize:vertical}
.sp-notes-input:focus{outline:none;border-color:rgba(201,146,42,.45)}

/* SPECIAL TRACKERS */
.ship-tracker{background:var(--navy);border:1px solid rgba(201,146,42,.2);border-radius:10px;padding:.6rem}
.ship-tracker-title{font-family:var(--font-d);font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-light);margin-bottom:.5rem;text-align:center}
.ship-row{display:flex;flex-direction:column;gap:.2rem;margin-bottom:.5rem}
.ship-row:last-of-type{margin-bottom:0}
.ship-name{font-family:var(--font-d);font-size:.65rem;font-weight:700;color:var(--parchment-dark)}
.ship-hp-display{display:flex;align-items:center;justify-content:space-between;margin-bottom:.25rem}
.ship-hp-val{font-family:var(--font-d);font-size:1.1rem;font-weight:900;color:var(--gold-bright)}
.ship-hp-max{font-family:var(--font-d);font-size:.7rem;color:var(--parchment-dark);opacity:.45}
.ship-bar-wrap{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-bottom:.3rem;overflow:hidden}
.ship-bar-fill{height:100%;border-radius:3px;transition:width var(--dur-ui) var(--ease-in-out-cubic),background var(--dur-ui) ease}
.ship-dmg-row{display:flex;gap:.25rem;flex-wrap:wrap}
.ship-btn{padding:.22rem .4rem;border-radius:5px;font-family:var(--font-d);font-size:.6rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border:none;background:rgba(192,57,43,.25);color:#ff8a80;border:1px solid rgba(192,57,43,.4)}
.ship-btn:active{background:rgba(192,57,43,.5)}
.ship-btn.heal{background:rgba(42,107,94,.25);color:#7dd8cc;border-color:rgba(42,107,94,.4)}
.ship-reset-btn{width:100%;margin-top:.4rem;padding:.3rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:6px;font-family:var(--font-d);font-size:.58rem;font-weight:700;color:var(--parchment-dark);opacity:.6;cursor:pointer;-webkit-tap-highlight-color:transparent}

.ritual-tracker{background:rgba(201,146,42,.06);border:1px solid rgba(201,146,42,.25);border-radius:10px;padding:.6rem}
.ritual-title{font-family:var(--font-d);font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-light);margin-bottom:.45rem;text-align:center}
.ritual-steps{display:flex;flex-direction:column;gap:.32rem}
.ritual-step{display:flex;align-items:flex-start;gap:.45rem;padding:.35rem .45rem;background:rgba(0,0,0,.2);border-radius:7px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ritual-step.done{opacity:.5}
.ritual-step.done .rs-text{text-decoration:line-through}
.rs-pip{width:22px;height:22px;border-radius:50%;border:2px solid rgba(201,146,42,.4);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.62rem;transition:background var(--dur-ui) var(--ease-out-cubic),border-color var(--dur-ui) var(--ease-out-cubic),transform var(--dur-micro) ease;will-change:transform}
.ritual-step:active .rs-pip{transform:scale(0.85)}
.ritual-step.done .rs-pip{background:var(--gold);border-color:var(--amber);color:var(--navy)}
.rs-num{font-family:var(--font-d);font-size:.65rem;font-weight:700;color:var(--gold-bright);white-space:nowrap;flex-shrink:0}
.rs-text{font-family:var(--font-b);font-size:.8rem;color:var(--parchment-dark);line-height:1.4}

.curse-tracker{background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.28);border-radius:10px;padding:.6rem}
.curse-title{font-family:var(--font-d);font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#ff8a80;margin-bottom:.1rem;text-align:center}
.curse-subtitle{font-family:var(--font-b);font-style:italic;font-size:.7rem;color:var(--parchment-dark);opacity:.5;text-align:center;margin-bottom:.45rem}
.curse-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.32rem}
.curse-btn{padding:.38rem .25rem;border-radius:7px;background:rgba(0,0,0,.2);border:1px solid rgba(192,57,43,.2);font-family:var(--font-d);font-size:.58rem;font-weight:700;color:var(--parchment-dark);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.15rem;min-height:48px;justify-content:center}
.curse-btn .ce{font-size:1rem}
.curse-btn.cursed{background:rgba(192,57,43,.28);border-color:var(--red);color:#ff8a80}

.sbl-label{font-family:var(--font-d);font-size:.42rem;font-weight:700;text-transform:uppercase;color:var(--gold-light);letter-spacing:.05em}

.npc-section-label{font-family:var(--font-d);font-size:.55rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--parchment-dark);opacity:.45;margin:.5rem 0 .28rem}

.loot-code-chip:active{opacity:.82}
.cc-lbl{font-family:var(--font-d);font-size:.5rem;font-weight:700;letter-spacing:.12em;color:rgba(201,146,42,.65)}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 10px);left:50%;transform:translateX(-50%);z-index:999;pointer-events:none}
.toast-msg{background:var(--navy-mid);border:1px solid rgba(201,146,42,.5);border-radius:10px;padding:.42rem .85rem;font-family:var(--font-d);font-size:.68rem;font-weight:700;letter-spacing:.05em;color:var(--gold-light);box-shadow:0 4px 16px rgba(0,0,0,.5);white-space:nowrap;animation:tin .2s ease,tout .3s ease 1.8s forwards}

}

    steps:['Island appears at dawn. Read the description slowly.',

    ra:{en:'The shrine is old enough that the jungle has started winning. Vines thread through carved stone, patient as centuries. The god it honours has no name — someone took great care to remove it, scraping every surface. What remains is a figure: crowned, oceanic, arms spread wide. Below, a carved tablet. The inscription reads: THE KRAKEN WAS NOT SUMMONED. IT WAS CHAINED. BREAK THE CHAIN, NOT THE KRAKEN.',
      sl:'Svetišče je dovolj staro, da džungla začenja zmagovati. Trte prepletajo klesani kamen, potrpežljive kot stoletja. Bog, ki mu je posvečeno, nima imena — nekdo si je vzel veliko truda, da ga je odstranil z vsake površine. Ostane le figura: kronana, oceanska, z razprtimi rokami. Spodaj je vrezan napis: KRAKEN NI BIL PRIKLICAN. BIL JE PRIKLENJEN. PRELOMI VERIGO, NE KRAKNA.'},

      sl:'Voda sega do pasu in je mrzla in se premika s počasnim, premišljenim namenom — kot da bi rajši niste bili tukaj. Kar koli ste prinesli za svetlobo, je odpovedalo. Na nasprotni steni so trije železni vzvodi. Nad vsakim, komaj berljivo skozi desetletja soli in korozije: LUNA. PLIMA. ZVEZDA.'},

      sl:'Voda v bazenu je bila mirna, odkar ste vstopili. Potem se dvigne. Ne voda, ki se obnaša kot voda — voda, ki se obnaša kot nekaj drugega, oblečena v vodo. Oblikuje se navzgor, najde obliko, ki je ravno dovolj človeška, da je vznemirljiva, ravno dovolj nečloveška, da je napačna.'},

    ra:{en:'It comes from below. The floor shatters first, then the walls crack, then the ceiling of the room above collapses somewhere else entirely. It is enormous. It is golden — gilded hide, coral-encrusted tentacles, barnacles that have had two hundred years to establish themselves. Its eyes glow deep amber. It is not looking at you with hunger. It is looking at you with the specific expression of someone who has been woken up for the third time this week.',
      sl:'Pride iz globin. Najprej se tla razbijejo, nato razpokajo stene, nato se strop zgornje sobe zruši nekam povsem drugam. Je ogromen. Je zlat — pozlačena koža, koralni lovke, barnakli, ki so imeli dvesto let časa, da se naselijo. Njegove oči žarijo v globokem jantarnem sijaju. Ne gleda vas s pohlepom. Gleda vas z določenim izrazom nekoga, ki so ga zbudili že tretjič ta teden.'},

function save(){try{localStorage.setItem('gk_gm',JSON.stringify(S));}catch(e){}}
function sceneState(id){return S.scenes.find(s=>s.id===id)||(S.scenes.push({id,done:false}),S.scenes[S.scenes.length-1]);}

// ══ TAB NAV ══
function switchTab(tab){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>{if(b.getAttribute('onclick')?.includes("'"+tab+"'"))b.classList.add('active');});
  S.activeTab=tab;save();
  if(tab==='notes')renderNotes();
  else if(tab==='combat')renderCombat();
  else if(tab==='party')renderParty();
  else if(tab==='npcs')renderNPCs();
  else if(tab==='loot')renderLoot();
}

let openSceneId=null;
let spTouchX=0;
function openScenePanel(id){
  openSceneId=id;

  document.getElementById('scene-panel').classList.add('open');
  document.getElementById('scene-panel').classList.toggle('sl-on',!!S.slOn);
  document.getElementById('sl-toggle-btn').classList.toggle('active',!!S.slOn);
}
function closeScenePanel(){
  document.getElementById('scene-panel').classList.remove('open');
  openSceneId=null;
  renderNotes();
}
function toggleSL(){
  S.slOn=!S.slOn;save();
  document.getElementById('scene-panel').classList.toggle('sl-on',S.slOn);
  document.getElementById('sl-toggle-btn').classList.toggle('active',S.slOn);
}
function navigateScene(dir){
  const idx=SCENES.findIndex(s=>s.id===openSceneId);
  const next=idx+dir;
  if(next<0||next>=SCENES.length)return;
  openScenePanel(SCENES[next].id);
}
function toggleSceneFromPanel(){
  const st=sceneState(openSceneId);
  st.done=!st.done;save();
  renderScenePanelFooter(openSceneId);
  showToast(st.done?'✓ Scene marked done':'↩ Unmarked');
}
function spTouchStart(e){spTouchX=e.touches[0].clientX;}
function spTouchEnd(e){const dx=e.changedTouches[0].clientX-spTouchX;if(Math.abs(dx)>60)navigateScene(dx<0?1:-1);}
let sceneNoteTimers={};
function saveSceneNote(id,val){
  clearTimeout(sceneNoteTimers[id]);
  sceneNoteTimers[id]=setTimeout(()=>{if(!S.sceneNotes)S.sceneNotes={};S.sceneNotes[id]=val;save();},400);
}
function renderScenePanelFooter(id){
  const idx=SCENES.findIndex(s=>s.id===id);
  const st=sceneState(id);
  const prevBtn=document.getElementById('sp-prev');
  const nextBtn=document.getElementById('sp-next');
  const doneBtn=document.getElementById('sp-done-btn');
  if(prevBtn)prevBtn.className='sp-nav-btn'+(idx===0?' disabled':'');
  if(nextBtn)nextBtn.className='sp-nav-btn'+(idx===SCENES.length-1?' disabled':'');
  if(doneBtn){doneBtn.textContent=st.done?'✓ Done':'Mark Done';doneBtn.className='sp-done-btn'+(st.done?' done':'');}
}

function startCombatFromScene(sceneId){
  const det=SD[sceneId];if(!det?.combat)return;
  det.combat.forEach(entry=>{
    const npc=NPCS.find(n=>n.id===entry.id);if(!npc)return;
    for(let i=0;i<(entry.count||1);i++){
      const cid=entry.id+(entry.count>1?'_'+i:'')+'_'+Date.now();
      if(!S.combat.combatants.find(c=>c.id===cid)){
        S.combat.combatants.push({id:cid,name:npc.name+(entry.count>1?' '+(i+1):''),init:0,hp:entry.hp,maxHp:entry.hp,type:'npc'});
      }
    }
  });
  if(S.combat.round===0)S.combat.round=1;
  save();closeScenePanel();switchTab('combat');
  showToast('⚔️ Enemies added to tracker — set initiatives!');
}

      <button class="ship-btn" onclick="applyShip('revenge',-10)">−10</button>

const var_amber='var(--amber)';const var_sea='var(--sea-light)';
function applyShip(ship,delta){
  if(!S.shipCombat)S.shipCombat={seahorse:50,revenge:60};
  const max=ship==='seahorse'?50:60;
  S.shipCombat[ship]=Math.max(0,Math.min(max,S.shipCombat[ship]+delta));
  save();
  const el=document.getElementById(ship==='seahorse'?'sh-hp':'rv-hp');
  const bar=document.getElementById(ship==='seahorse'?'sh-bar':'rv-bar');
  if(el)el.textContent=S.shipCombat[ship];
  const pct=S.shipCombat[ship]/max*100;
  if(bar){bar.style.width=pct+'%';bar.style.background=pct<=25?'#ef4444':pct<=50?'var(--amber)':'var(--sea-light)';}
  if(S.shipCombat[ship]===0)showToast('💥 '+(ship==='seahorse'?'Seahorse':'Crimson Revenge')+' is SINKING! 3 rounds!');
}

}
function toggleRitual(i){S.ritualSteps[i]=!S.ritualSteps[i];save();const el=document.getElementById('sp-body');if(el&&openSceneId)renderScenePanel(openSceneId);
  const done=S.ritualSteps.filter(Boolean).length;if(done===3)showToast('✨ Ritual complete! The chain breaks!');}
// ══ CURSE TRACKER ══
function buildCurseTracker(){
  return`<div class="curse-tracker">
  <div class="curse-title">💛 Curse of Gilded Greed</div>
  <div class="curse-subtitle">Touch vault gold before resolving the Kraken → DC 13 WIS at combat start or lose first action</div>
  <div class="curse-grid">
  ${GM_CHARS.map((c,i)=>`<div class="curse-btn${S.curseTracker[i]?' cursed':''}" onclick="toggleCurse(${i})">
    <span class="ce">${c.emoji}</span>${c.name.split(' ')[0]}${S.curseTracker[i]?'<br>💛 CURSED':''}
  </div>`).join('')}
  </div>
  <button class="curse-reset-btn" onclick="resetCurse()">↺ Clear all curses (curse resolved)</button>
  </div>`;
}
function toggleCurse(i){S.curseTracker[i]=!S.curseTracker[i];save();if(openSceneId)renderScenePanel(openSceneId);
  showToast(S.curseTracker[i]?GM_CHARS[i].name.split(' ')[0]+' is CURSED 💛':'Curse lifted for '+GM_CHARS[i].name.split(' ')[0]);}
function resetCurse(){S.curseTracker=[false,false,false,false,false,false];save();if(openSceneId)renderScenePanel(openSceneId);}
// ══ NPC MINI CARD ══
function showNPCMini(id){
  const npc=NPCS.find(n=>n.id===id);if(!npc)return;
  const actions=npc.actions.slice(0,3).map(a=>`<div class="nmc-action"><div class="nmc-an">${a.n}</div><div class="nmc-ad">${a.d}</div></div>`).join('');
  document.getElementById('nmc-content').innerHTML=`
    <div class="nmc-head"><div class="nmc-emoji">${npc.emoji}</div><div><div class="nmc-name">${npc.name}</div><div class="nmc-role">${npc.role}</div></div></div>
    <div class="nmc-stats"><span class="nmc-stat">AC ${npc.ac}</span><span class="nmc-stat">HP ${npc.hp}</span><span class="nmc-stat">Spd ${npc.speed}</span></div>
    ${actions}`;
  document.getElementById('npc-mini-overlay').classList.add('open');
}
function closeNPCMini(){document.getElementById('npc-mini-overlay').classList.remove('open');}
// ══ NOTES TAB ══
function renderNotes(){
  const el=document.getElementById('tab-notes');
  const acts=[1,2,3];
  const actLabels={1:'Act 1 — All Aboard the Chaos',2:'Act 2 — Isla Maldita',3:'Act 3 — The Kraken Problem'};
  let scenesHtml='';
  acts.forEach(a=>{
    scenesHtml+=`<div class="act-label">${actLabels[a]}</div><div class="scene-list">`;
    SCENES.filter(s=>s.act===a).forEach(s=>{
      const st=sceneState(s.id);
      scenesHtml+=`<div class="scene-row${st.done?' done':''}">
        <div class="scene-check" onclick="toggleScene('${s.id}')">${st.done?'✓':''}</div>
        <div class="scene-info" onclick="openScenePanel('${s.id}')">
          <div class="scene-label">${s.label}</div>
          <div class="scene-desc">${s.desc}</div>
          <div class="scene-open-hint">tap for full guide →</div>
        </div>
      </div>`;
    });
    scenesHtml+='</div>';
  });
  // Scene notes summary
  let sceneNotesHtml='';
  if(S.sceneNotes){
    acts.forEach(a=>{
      const entries=SCENES.filter(s=>s.act===a&&S.sceneNotes[s.id]?.trim());
      if(!entries.length)return;
      sceneNotesHtml+=`<div class="act-label">${actLabels[a]}</div>`;
      entries.forEach(s=>{sceneNotesHtml+=`<div class="scene-note-entry"><div class="sne-label">${s.label}</div><div class="sne-text">${S.sceneNotes[s.id]}</div></div>`;});
    });
  }
  el.innerHTML=`
    <div class="card"><div class="card-head" onclick="toggleCard(this)">📍 &nbsp;Scene Progress <span class="chv">▾</span></div>
    <div class="card-body">${scenesHtml}</div></div>
    <div class="card"><div class="card-head" onclick="toggleCard(this)">📝 &nbsp;Session Notes <span class="chv">▾</span></div>
    <div class="card-body"><textarea class="notes-textarea" id="gm-notes" placeholder="Running notes, player decisions, improvised NPCs…" oninput="saveGMNotes(this.value)">${S.notes||''}</textarea></div></div>
    ${sceneNotesHtml?`<div class="card"><div class="card-head collapsed" onclick="toggleCard(this)">🗒 &nbsp;Scene Notes <span class="chv">▾</span></div><div class="card-body hidden">${sceneNotesHtml}</div></div>`:''}
    <div class="card"><div class="card-head collapsed" onclick="toggleCard(this)">🎲 &nbsp;Quick Reference <span class="chv">▾</span></div>
    <div class="card-body hidden">
      <div style="font-family:var(--font-d);font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--parchment-dark);opacity:.5;margin-bottom:.38rem">Difficulty Class</div>
      <div class="quick-ref-grid">
        <div class="qr-box"><div class="qr-diff">Easy</div><div class="qr-dc">10</div></div>
        <div class="qr-box"><div class="qr-diff">Medium</div><div class="qr-dc">14</div></div>
        <div class="qr-box"><div class="qr-diff">Hard</div><div class="qr-dc">17</div></div>
        <div class="qr-box"><div class="qr-diff">Very Hard</div><div class="qr-dc">20</div></div>
      </div>
      <div style="height:.55rem"></div>
      <button class="sea-event-btn" onclick="rollSeaEvent()">🌊 Roll Random Sea Event (d6)</button>
      <div class="sea-event-result" id="sea-event-result"></div>
    </div></div>`;
}
function toggleScene(id){const st=sceneState(id);st.done=!st.done;save();renderNotes();}
let notesTimer;
function saveGMNotes(v){clearTimeout(notesTimer);notesTimer=setTimeout(()=>{S.notes=v;save();},400);}
function rollSeaEvent(){const r=Math.floor(Math.random()*6);const el=document.getElementById('sea-event-result');el.textContent='d6: '+(r+1)+' — '+SEA_EVENTS[r];el.classList.remove('visible');requestAnimationFrame(()=>el.classList.add('visible'));showToast('🌊 Sea event: '+(r+1));}
function toggleCard(head){const body=head.nextElementSibling;const c=head.classList.contains('collapsed');head.classList.toggle('collapsed',!c);body.classList.toggle('hidden',!c);}
// ══ COMBAT TAB ══
function renderCombat(){
  const el=document.getElementById('tab-combat');
  const {round,activeIdx,combatants}=S.combat;
  const sorted=[...combatants].sort((a,b)=>b.init-a.init);
  const activeId=combatants[activeIdx]?.id;
  let rowsHtml=combatants.length===0?'<div class="empty-combat">No combatants yet.<br>Add enemies above or Quick Add PCs.</div>':
    sorted.map(c=>{
      const pct=c.maxHp>0?Math.max(0,Math.min(100,c.hp/c.maxHp*100)):0;
      const hpCls=pct<=25?'danger':pct<=50?'warning':'';
      const isActive=c.id===activeId;
      return`<div class="combatant-row type-${c.type}${isActive?' active-turn':''}">
        <div class="combatant-top">
          <div class="c-init">${c.init}</div><div class="c-name">${c.name}</div>
          <div class="c-hp-display${hpCls?' '+hpCls:''}">${c.hp}/${c.maxHp}</div>
          <div class="c-remove" onclick="removeCombatant('${c.id}')">✕</div>
        </div>
        <div class="hp-bar-wrap"><div class="hp-bar-fill${hpCls?' '+hpCls:''}" style="width:${pct}%"></div></div>
        <div class="dmg-row">
          <button class="dmg-btn neg" onclick="applyHp('${c.id}',-25)">−25</button>
          <button class="dmg-btn neg" onclick="applyHp('${c.id}',-10)">−10</button>
          <button class="dmg-btn neg" onclick="applyHp('${c.id}',-5)">−5</button>
          <button class="dmg-btn neg" onclick="applyHp('${c.id}',-1)">−1</button>
          <input class="custom-dmg" id="cdmg-${c.id}" type="number" placeholder="±" inputmode="numeric">
          <button class="apply-btn" onclick="applyCustomDmg('${c.id}')">Apply</button>
          <button class="dmg-btn pos" onclick="applyHp('${c.id}',5)">+5</button>
          <button class="dmg-btn pos" onclick="applyHp('${c.id}',10)">+10</button>
        </div></div>`;
    }).join('');
  el.innerHTML=`
    <div class="add-form">
      <div class="add-form-title">➕ Add Combatant</div>
      <div class="add-row">
        <input class="add-input" id="add-name" type="text" placeholder="Name">
        <input class="add-input small" id="add-init" type="number" placeholder="Init" inputmode="numeric">
        <input class="add-input small" id="add-hp" type="number" placeholder="HP" inputmode="numeric">
        <button class="add-btn" onclick="addCombatant()">Add</button>
      </div>
      <div style="font-family:var(--font-d);font-size:.52rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--parchment-dark);opacity:.4;margin-bottom:.28rem">Quick add PCs</div>
      <div class="quick-add-row">${GM_CHARS.map(c=>`<div class="qa-btn" onclick="quickAddPC(${c.idx})">${c.emoji} ${c.name.split(' ')[0]}</div>`).join('')}</div>
    </div>
    <div class="combat-controls">
      <div class="round-display">Round <span>${round===0?'—':round}</span></div>
      <div style="display:flex;gap:.4rem"><button class="clear-btn" onclick="clearCombat()">🗑 Clear</button><button class="next-btn" onclick="nextTurn()">▶ Next</button></div>
    </div>
    <div class="combatant-list">${rowsHtml}</div>`;
}
function addCombatant(){const name=document.getElementById('add-name').value.trim();const init=parseInt(document.getElementById('add-init').value)||0;const hp=parseInt(document.getElementById('add-hp').value)||20;if(!name){showToast('Enter a name');return;}S.combat.combatants.push({id:Date.now().toString(),name,init,hp,maxHp:hp,type:'enemy'});if(S.combat.round===0)S.combat.round=1;save();renderCombat();showToast('➕ '+name+' added');}
function quickAddPC(idx){const c=GM_CHARS[idx];if(S.combat.combatants.find(x=>x.id==='pc_'+idx)){showToast(c.name+' already in tracker');return;}S.combat.combatants.push({id:'pc_'+idx,name:c.full,init:0,hp:c.maxHp,maxHp:c.maxHp,type:'player'});if(S.combat.round===0)S.combat.round=1;save();renderCombat();showToast('➕ '+c.name+' added — set initiative!');}
function addNPCToCombat(npcId){const npc=NPCS.find(n=>n.id===npcId);if(!npc)return;if(S.combat.combatants.find(x=>x.id===npcId)){showToast(npc.name+' already in tracker');return;}const init=parseInt(prompt(npc.name+' — initiative?','0'))||0;S.combat.combatants.push({id:npcId,name:npc.name,init,hp:npc.hp,maxHp:npc.hp,type:'npc'});if(S.combat.round===0)S.combat.round=1;save();switchTab('combat');showToast('⚔️ '+npc.name+' added (init '+init+')');}
function applyHp(id,delta){
  const c=S.combat.combatants.find(x=>x.id===id);if(!c)return;
  const prev=c.hp;
  c.hp=Math.max(0,Math.min(c.maxHp,c.hp+delta));
  if(c.hp===0)showToast('💀 '+c.name+' is DOWN!');
  save();
  // Update HP display and bar in-place without full re-render
  const rows=document.querySelectorAll('.combatant-row');
  let found=false;
  rows.forEach(row=>{
    const btn=row.querySelector('[onclick*="'+id+'"]');
    if(!btn&&!row.innerHTML.includes('"'+id+'"'))return;
    const hpEl=row.querySelector('.c-hp-display');
    const barEl=row.querySelector('.hp-bar-fill');
    if(hpEl&&barEl){
      found=true;
      const pct=c.maxHp>0?Math.max(0,Math.min(100,c.hp/c.maxHp*100)):0;
      const hpCls=pct<=25?'danger':pct<=50?'warning':'';
      hpEl.textContent=c.hp+'/'+c.maxHp;
      hpEl.className='c-hp-display'+(hpCls?' '+hpCls:'')+(delta<0?' anim-dmg':' anim-heal');
      hpEl.addEventListener('animationend',()=>hpEl.classList.remove('anim-dmg','anim-heal'),{once:true});
      barEl.style.width=pct+'%';
      barEl.className='hp-bar-fill'+(hpCls?' '+hpCls:'');
    }
  });
  if(!found)renderCombat();
}
function applyCustomDmg(id){const input=document.getElementById('cdmg-'+id);const val=parseInt(input?.value)||0;if(!val)return;applyHp(id,val);}
function removeCombatant(id){S.combat.combatants=S.combat.combatants.filter(c=>c.id!==id);if(S.combat.activeIdx>=S.combat.combatants.length)S.combat.activeIdx=0;save();renderCombat();}
function nextTurn(){const c=S.combat.combatants;if(!c.length)return;const sorted=[...c].sort((a,b)=>b.init-a.init);if(S.combat.activeIdx===-1){S.combat.activeIdx=0;S.combat.round=1;}else{const curId=c[S.combat.activeIdx]?.id;const curSi=sorted.findIndex(x=>x.id===curId);const nsi=(curSi+1)%sorted.length;if(nsi===0)S.combat.round++;const nid=sorted[nsi].id;S.combat.activeIdx=c.findIndex(x=>x.id===nid);}const active=c[S.combat.activeIdx];showToast('▶ Round '+S.combat.round+' — '+active.name);save();renderCombat();}
function clearCombat(){if(!confirm('Clear all combatants and reset round counter?'))return;S.combat={round:0,activeIdx:-1,combatants:[]};save();renderCombat();showToast('🗑 Combat cleared');}
// ══ PARTY TAB ══
function renderParty(){
  const el=document.getElementById('tab-party');
  el.innerHTML='<div class="party-grid">'+GM_CHARS.map(c=>{
    const exp=S.cardExpanded?.['pc_'+c.idx];
    const wHtml=c.weapons.map(w=>`<div class="pc-weapon"><span class="pcw-name">${w.n}</span><span class="pcw-hit">${w.h}</span><span class="pcw-dmg">${w.d}</span></div>`).join('');
    return`<div class="pc-card">
      <div class="pc-head" onclick="togglePCCard(${c.idx})">
        <div class="pc-emoji">${c.emoji}</div>
        <div class="pc-info"><div class="pc-name">${c.full}</div><div class="pc-class">${c.cls}</div>
          <div class="pc-stats-row"><span class="pc-stat-chip">HP ${c.maxHp}</span><span class="pc-stat-chip">AC ${c.ac}</span><span class="pc-stat-chip">Init ${c.init}</span><span class="pc-stat-chip">PP ${c.passPerc}</span>${c.spellSave?`<span class="pc-stat-chip">DC ${c.spellSave}</span>`:''}</div>
        </div>
      </div>
      <div class="pc-detail${exp?' open':''}">
        <div class="pc-detail-grid">
          <div><span class="pc-detail-label">Saves (Prof)</span>${c.profSaves}</div>
          ${c.spellSave?`<div><span class="pc-detail-label">Spell Save DC</span>${c.spellSave}</div>`:''}
          ${c.darkvision?`<div><span class="pc-detail-label">Darkvision</span>${c.darkvision}</div>`:''}
          <div><span class="pc-detail-label">Pass. Perception</span>${c.passPerc}</div>
        </div>
        <div class="divider"></div>
        <div class="pc-weapon-list">${wHtml}</div>
        <div class="divider"></div>
        <div class="pc-feat-list">${c.features.map(f=>'• '+f).join('<br>')}</div>
      </div>
    </div>`;
  }).join('')+'</div>';
}
function togglePCCard(idx){if(!S.cardExpanded)S.cardExpanded={};S.cardExpanded['pc_'+idx]=!S.cardExpanded['pc_'+idx];save();renderParty();}
// ══ NPC TAB ══
function renderNPCs(){
  const el=document.getElementById('tab-npcs');
  el.innerHTML='<div class="npc-list">'+NPCS.map(npc=>{
    const exp=S.npcExpanded?.[npc.id];
    const statRow=npc.stats?`<div class="stat-block-row">${['str','dex','con','int','wis','cha'].map(s=>{const v=npc.stats[s];const m=Math.floor((v-10)/2);return`<div class="sbl-box"><div class="sbl-label">${s.toUpperCase()}</div><div class="sbl-score">${v}</div><div class="sbl-mod">${m>=0?'+'+m:m}</div></div>`;}).join('')}</div>`:'';
    const actHtml=npc.actions?.length?`<div class="npc-section-label">Actions</div><div class="action-list">${npc.actions.map(a=>`<div class="action-row"><div class="action-name">${a.n}</div><div class="action-desc">${a.d}</div></div>`).join('')}</div>`:'';
    const baHtml=npc.bonusActions?.length?`<div class="npc-section-label">Bonus Actions</div><div class="action-list">${npc.bonusActions.map(a=>`<div class="action-row"><div class="action-name">${a.n}</div><div class="action-desc">${a.d}</div></div>`).join('')}</div>`:'';
    const rxHtml=npc.reactions?.length?`<div class="npc-section-label">Reactions</div><div class="action-list">${npc.reactions.map(a=>`<div class="action-row"><div class="action-name">${a.n}</div><div class="action-desc">${a.d}</div></div>`).join('')}</div>`:'';
    const outHtml=npc.outcomes?.length?`<div class="npc-section-label">Outcomes</div><div class="outcome-list">${npc.outcomes.map(o=>`<div class="outcome-row"><div class="outcome-label">${o.label}</div><div class="outcome-desc">${o.d}</div></div>`).join('')}</div>`:'';
    const secHtml=npc.secret?`<div class="npc-secret"><div class="npc-secret-label">🔒 Secret</div><div class="npc-secret-text">${npc.secret}</div></div>`:'';
    const saves=npc.saves&&npc.saves!=='—'?`<div style="font-family:var(--font-b);font-size:.72rem;color:var(--parchment-dark);margin-top:.2rem"><strong>Saves:</strong> ${npc.saves}${npc.skills&&npc.skills!=='—'?' · <strong>Skills:</strong> '+npc.skills:''}</div>`:'';
    const heartHtml=npc.id==='kraken'?`<div class="heart-mechanic"><div class="heart-label">💛 Amber Heart — Weakness</div><div class="heart-text">Announce targeting heart before rolling. <strong>DC 18 attack/spell</strong> → stunned 1 round. <strong>Three hits = fight ends.</strong></div></div>`:'';
    return`<div class="npc-card">
      <div class="npc-head" onclick="toggleNPC('${npc.id}')">
        <div class="npc-emoji">${npc.emoji}</div>
        <div style="flex:1"><div class="npc-name">${npc.name}${npc.cr?` <span style="font-size:.52rem;opacity:.55">CR ${npc.cr}</span>`:''}</div>
          <div class="npc-role">${npc.role}</div>
          <div class="npc-key-stats"><span class="npc-stat">AC ${npc.ac}${npc.acNote?' ('+npc.acNote+')':''}</span><span class="npc-stat">HP ${npc.hp}</span><span class="npc-stat">${npc.speed}</span></div>
        </div>
      </div>
      <div class="npc-body${exp?' open':''}">
        ${statRow}${saves}${actHtml}${baHtml}${rxHtml}
        <div class="divider"></div>
        <div class="npc-personality">${npc.personality}</div>
        ${heartHtml}${outHtml}${secHtml}
        ${['pete','giulia','gcrab','pirate','veteran'].includes(npc.id)?'':
          `<button class="add-to-combat-btn" onclick="addNPCToCombat('${npc.id}')">⚔️ Add to Combat Tracker</button>`}
      </div>
    </div>`;
  }).join('')+'</div>';
}
function toggleNPC(id){if(!S.npcExpanded)S.npcExpanded={};S.npcExpanded[id]=!S.npcExpanded[id];save();renderNPCs();}
// ══ LOOT TAB ══
function renderLoot(){
  const el=document.getElementById('tab-loot');
  const charOpts='<option value="-1">— Unassigned —</option>'+GM_CHARS.map(c=>`<option value="${c.idx}">${c.emoji} ${c.name}</option>`).join('');
  el.innerHTML='<div class="loot-list">'+LOOT.map(item=>{
    const st=lootState(item.id);
    const rCls='rarity-'+item.rarity.toLowerCase().replace(' ','-').replace('very-rare','very-rare');
    return`<div class="loot-card${st.distributed?' distributed':''}">
      <div class="loot-header"><div class="loot-emoji">${item.emoji}</div><div class="loot-name">${item.name}</div>
        <span class="rarity-badge ${rCls}">${item.rarity}</span>${item.cursed?'<span class="cursed-badge">CURSED</span>':''}
      </div>
      <div class="loot-type">${item.type}</div>
      <div class="loot-desc">${item.desc}</div>
      <div class="loot-fx">${item.fx}</div>
      <div class="loot-assign-row"><span class="assign-label">Send to:</span>
        <select class="assign-select" id="assign-${item.id}" onchange="assignItem('${item.id}',this.value)">${charOpts}</select>
      </div>
      <div class="loot-code-chip" onclick="copyItemCode('${item.id}')" title="Tap to copy — or just read it out to the player">
        <span class="cc-lbl">CODE</span><span class="cc-val">${item.code}</span><span class="cc-ico">📋</span>
      </div>
      <div class="loot-actions">
        <button class="sent-btn${st.distributed?' active':''}" onclick="toggleDistributed('${item.id}')">${st.distributed?'✓ Sent':'Mark Sent'}</button>
      </div>
    </div>`;
  }).join('')+'</div>';
  LOOT.forEach(item=>{const st=lootState(item.id);const sel=document.getElementById('assign-'+item.id);if(sel)sel.value=st.assignedChar;});
}
function assignItem(id,charIdx){const st=lootState(id);st.assignedChar=parseInt(charIdx);save();}
async function copyItemCode(id){
  const item=LOOT.find(it=>it.id===id);
  if(!item)return;
  try{await navigator.clipboard.writeText(item.code);showToast('📋 Code “'+item.code+'” copied');}
  catch(e){showToast('Code: '+item.code+' — read it out to the player');}
}
function toggleDistributed(id){const st=lootState(id);st.distributed=!st.distributed;save();renderLoot();}
// ══ TOAST ══
let toastT;
function showToast(msg){const el=document.getElementById('toast');el.innerHTML=`<div class="toast-msg">${msg}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>el.innerHTML='',2200);}
// ══ INIT ══
renderNotes();renderParty();
switchTab(S.activeTab||'notes');
</script>
